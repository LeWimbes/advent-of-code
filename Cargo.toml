[workspace]
resolver = "3"

members = ["20*/day*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
aoc-cache.path = "crates/aoc-cache"
aoc-macros.path = "crates/aoc-macros"
aoc-utils.path = "crates/aoc-utils"

# aoc-cache: fetching and caching puzzle data
ratelimit = "0.10.0"
rookie = "0.5.6"
thiserror = "2.0.18"
ureq = "3.2.0"

# aoc-macros: procedural macros
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = "2.0.115"

# Testing
rstest = "0.26.1"

# Parsing
regex = "1.12.3"
winnow = "0.7.14"

# Iterators and parallelism
itertools = "0.14.0"
rayon = "1.11.0"

# Math and optimization
good_lp = {
  version = "1.14.2",
  default-features = false,
  features = ["microlp"]
}
nalgebra = "0.34.1"
num = "0.4.3"

# Output and visualization
colored = "3.1.1"
image = "0.25.9"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Puzzle inputs are small and well-formed, so numeric casts are fine.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Short and similar names are normal in math-heavy puzzle code.
many_single_char_names = "allow"
similar_names = "allow"
