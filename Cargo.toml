[workspace]
resolver = "3"

members = ["crates/*", "20*/day*"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.lints.clippy]
pedantic = "warn"


[workspace.dependencies]
# Internal crates
aoc-cache.path = "crates/aoc-cache"
aoc-macros.path = "crates/aoc-macros"
aoc-utils.path = "crates/aoc-utils"

# aoc-cache: fetching and caching puzzle data
ratelimit = "0.10.0"
rookie = "0.5.6"
thiserror = "2.0.18"
ureq = "3.2.0"

# aoc-macros: procedural macros
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = "2.0.115"

# Testing
rstest = "0.26.1"

# Parsing
regex = "1.12.3"
winnow = "0.7.14"

# Iterators and parallelism
itertools = "0.14.0"
rayon = "1.11.0"

# Math and optimization
good_lp = { version = "1.14.2", features = ["microlp"], default-features = false }
nalgebra = "0.34.1"
num = "0.4.3"

# Output and visualization
colored = "3.1.1"
image = "0.25.9"
