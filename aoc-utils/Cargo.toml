[workspace]
resolver = "3"

members = ["aoc-utils", "aoc-cache", "aoc-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.lints.clippy]
pedantic = "warn"


[workspace.dependencies]
aoc-cache.path = "aoc-cache"
aoc-macros.path = "aoc-macros"

ratelimit = "0.10.0"
rookie = "0.5.6"
thiserror = "2.0.18"
ureq = "3.2.0"

proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = "2.0.115"
